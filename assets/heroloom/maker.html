<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroloom Free — Character Maker</title>
<style>
/* Monochrome dark theme: the interface uses only black, white and greys. The only colours on screen belong to the character. */
:root{--bg:#0a0a0a;--panel:#131313;--raise:#1b1b1b;--line:#2a2a2a;--line2:#3d3d3d;--ink:#f2f2f2;--dim:#8d8d8d;--faint:#5c5c5c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
header h1{font-size:14px;font-weight:650;margin:0;letter-spacing:.01em}
header .ver{color:var(--faint);font-size:12px}
header .sp{flex:1}
.btn{background:transparent;border:1px solid var(--line2);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--ink);color:#000;border-color:var(--ink);font-weight:600}
.btn.solid:hover{background:#fff}
.btn.on{background:var(--ink);color:#000;border-color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:5px}
main{display:grid;grid-template-columns:minmax(360px,1fr) minmax(380px,460px);min-height:0}
/* ---- left: stage */
.stage{display:grid;grid-template-rows:1fr auto;min-height:0;border-right:1px solid var(--line)}
.view{position:relative;display:grid;place-items:center;min-height:240px;overflow:hidden}
.view canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.view .info{position:absolute;left:16px;bottom:12px;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.view .bgs{position:absolute;right:14px;bottom:10px;display:flex;gap:6px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.dock{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px;background:var(--panel)}
.label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.exports{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
textarea{width:100%;height:58px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);resize:vertical}
textarea:focus{outline:none;border-color:var(--line2);color:var(--ink)}
.note{color:var(--faint);font-size:12px;min-height:17px}
/* ---- right: wardrobe */
.side{display:grid;grid-template-rows:auto auto 1fr;min-height:0;background:var(--panel)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.tab{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--dim);display:flex;align-items:baseline;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#000}
.tab .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.0;align-self:center}
.tab.has .dot{opacity:.9}
.colours{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);min-height:45px}
.colours .name{color:var(--dim);font-size:12px;margin-left:4px}
.grid{overflow:auto;padding:12px 14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;align-content:start}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 4px 5px;cursor:pointer;display:grid;justify-items:center;gap:3px;color:var(--dim);min-width:0}
.tile:hover{border-color:var(--line2);color:var(--ink)}
.tile.on{border-color:var(--ink);color:var(--ink);background:#222}
.tile canvas,.tile .none{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges}
.tile .none{display:grid;place-items:center;color:var(--faint);font-size:22px;line-height:1}
.tile span{font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--dim)}
.look:hover{border-color:var(--line2);color:var(--ink)}
.grid.looks{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:6px;border:2px solid var(--panel)}::-webkit-scrollbar-track{background:transparent}
@media (max-width:820px){main{grid-template-columns:1fr;grid-auto-rows:minmax(0,auto)}.stage{border-right:0;border-bottom:1px solid var(--line)}.view{min-height:300px}}
</style>

<header>
  <h1>Heroloom Free</h1><span class="ver">Character Maker · v1.0.0</span>
  <span class="sp"></span><a class="btn" href="https://ljs0218.itch.io/heroloom" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Get the full pack — 998 parts</a>
  <button class="btn" id="clear">Clear</button>
  <button class="btn" id="randcol">Random colours</button>
  <button class="btn solid" id="random">Random character</button>
</header>

<main>
  <section class="stage">
    <div class="view" id="viewbox">
      <canvas id="view" width="128" height="96"></canvas>
      <div class="info" id="info"></div>
      <div class="bgs" id="bgs" title="Preview background"></div>
    </div>
    <div class="dock">
      <div class="label">Animation</div>
      <div class="chips" id="acts"></div>
      <div class="label" style="margin-top:4px">Export</div>
      <div class="exports">
        <textarea id="recipe" spellcheck="false" placeholder="Recipe (JSON). Paste one here and press Load."></textarea>
        <div class="chips" style="flex-direction:column;align-items:stretch">
          <button class="btn sm solid" id="png">Sprite sheet PNG</button>
          <button class="btn sm" id="json">Frames JSON</button>
        </div>
      </div>
      <div class="chips">
        <button class="btn sm" id="copy">Copy recipe</button>
        <button class="btn sm" id="load">Load recipe</button>
        <button class="btn sm" id="pack">Add pack folder…</button>
        <input id="dir" type="file" webkitdirectory multiple hidden>
        <span class="note" id="note" style="align-self:center"></span>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="tabs" id="tabs"></div>
    <div class="colours" id="colours"></div>
    <div class="grid" id="grid"></div>
  </aside>
</main>

<script>
// Paper-doll character runtime (browser, no dependencies).
//
//   const doll = new PaperDoll(spec, { base: "path/to/core/" });      // spec = parsed character.json
//   doll.addPack(packJson, "path/to/pack/");                          // optional add-on packs
//   const sheet = await doll.bake({ parts: { hair: "bob", top: "tunic" }, colors: { hair: "red" } });
//   const f = doll.frame("walk", 2);                                  // { x, y, w, h, ms }
//   ctx.drawImage(sheet, f.x, f.y, f.w, f.h, px - doll.foot[0], py - doll.foot[1], f.w, f.h);
//
// A character is a "recipe": { parts: { slot: partId }, colors: { slot: variantName } }.
// bake() stacks every chosen part's sheet in spec.layers order into ONE sheet with the same grid
// (cell = spec.cell, one row per action), recolouring each part by exact-colour palette swap.
// Sprites face right; mirror horizontally for left.
(function (root) {
  "use strict";

  const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

  class PaperDoll {
    /**
     * @param spec  parsed character.json of the core pack
     * @param opts  { base: url prefix of the core pack ("" or ends with "/"),
     *                loadImage: async (url) => drawable  — override to load from somewhere else }
     */
    constructor(spec, opts = {}) {
      this.spec = JSON.parse(JSON.stringify(spec));
      this.loadImage = opts.loadImage || PaperDoll.loadImage;
      this.cell = this.spec.cell;
      this.foot = this.spec.foot;
      this.columns = this.spec.columns;
      this.rows = Object.keys(this.spec.actions).length;
      this._images = new Map(); // url → drawable
      this._tinted = new Map(); // url|ramp|variant → canvas
      for (const slot of Object.values(this.spec.slots)) for (const part of Object.values(slot.parts)) part.base = opts.base || "";
    }

    /** Merge an add-on pack (its pack.json) into this doll. base = url prefix of the pack folder. */
    addPack(pack, base = "") {
      for (const [slot, def] of Object.entries(pack.slots || {})) {
        if (!this.spec.slots[slot]) continue;
        for (const [id, part] of Object.entries(def.parts)) this.spec.slots[slot].parts[id] = { ...part, base };
      }
      Object.assign(this.spec.looks, pack.looks || {});
      return this;
    }

    /** Slot names in a sensible UI order (draw order, duplicates removed). */
    get slots() {
      return [...new Set(this.spec.layers.map((l) => l.slot))].filter((s) => this.spec.slots[s]);
    }
    partIds(slot) {
      return Object.keys(this.spec.slots[slot].parts);
    }
    /** Colour variant names a slot can take (empty if the slot is not recolourable). */
    colorNames(slot) {
      const ramp = this.spec.slots[slot].color;
      return ramp ? Object.keys(this.spec.palettes[ramp].variants) : [];
    }
    /** A ready-made recipe from spec.looks (themed sets live here too). */
    look(name) {
      const l = this.spec.looks[name];
      return l ? { parts: { ...l.parts }, colors: { ...l.colors } } : null;
    }
    /** A random recipe. keep = probability that an optional slot is filled. */
    random(rng = Math.random, keep = { hair: 0.95, top: 1, bottom: 0.9, shoes: 0.95, weapon: 0.8, hat: 0.45, acc: 0.35, cape: 0.3, back: 0.25, shield: 0.35 }) {
      const pick = (a) => a[Math.floor(rng() * a.length)];
      const r = { parts: {}, colors: {} };
      for (const slot of this.slots) {
        const def = this.spec.slots[slot];
        if (!def.required && rng() < (keep[slot] ?? 0.5)) r.parts[slot] = pick(this.partIds(slot));
        const names = this.colorNames(slot);
        if (names.length) r.colors[slot] = pick(names);
      }
      return r;
    }

    /** { x, y, w, h, ms } of one frame in a baked sheet (i wraps for looping actions, clamps otherwise). */
    frame(action, i) {
      const a = this.spec.actions[action], [w, h] = this.cell;
      const n = a.loop ? ((i % a.frames) + a.frames) % a.frames : Math.max(0, Math.min(a.frames - 1, i));
      return { x: n * w, y: a.row * h, w, h, ms: a.ms, index: n };
    }
    /** Frame index at time t (ms since the action started); done = a non-looping action has finished. */
    frameAt(action, t) {
      const a = this.spec.actions[action], n = Math.floor(t / a.ms);
      return { ...this.frame(action, n), done: !a.loop && n >= a.frames };
    }
    /** Head / hand anchor of a frame in cell pixels (for attaching effects, name tags, …). */
    anchor(action, i) {
      return this.spec.anchors[action][this.frame(action, i).index];
    }

    /** Compose a recipe into one sheet. Returns a canvas (width = columns × cell width, one row per action). */
    async bake(recipe) {
      const spec = this.spec, [cw, ch] = this.cell;
      const out = PaperDoll.canvas(this.columns * cw, this.rows * ch), ctx = out.getContext("2d");
      const chosen = {};
      for (const [slot, def] of Object.entries(spec.slots)) if (def.required) chosen[slot] = Object.keys(def.parts)[0];
      Object.assign(chosen, recipe.parts || {});
      const hat = chosen.hat && spec.slots.hat && spec.slots.hat.parts[chosen.hat];
      const covered = !!(hat && hat.coversHair); // a hat that covers the head → hair uses its "under" layer
      for (const { slot, layer } of spec.layers) {
        const def = spec.slots[slot], id = chosen[slot];
        const part = def && id && def.parts[id];
        if (!part) continue;
        const rel = part.layers[covered && slot === "hair" && layer === "main" ? "under" : layer];
        if (!rel) continue;
        const colorSlot = part.colorFrom || slot; // e.g. a beard follows the hair colour
        const ramp = spec.slots[colorSlot] && spec.slots[colorSlot].color;
        ctx.drawImage(await this._tint(part.base + rel, ramp, (recipe.colors || {})[colorSlot]), 0, 0);
      }
      return out;
    }

    async _tint(url, ramp, variant) {
      if (!this._images.has(url)) this._images.set(url, await this.loadImage(url));
      const img = this._images.get(url), pal = ramp && this.spec.palettes[ramp];
      if (!pal || !variant || !pal.variants[variant] || pal.variants[variant].join() === pal.base.join()) return img;
      const key = url + "|" + ramp + "|" + variant;
      if (this._tinted.has(key)) return this._tinted.get(key);
      const c = PaperDoll.canvas(img.width, img.height), x = c.getContext("2d");
      x.drawImage(img, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), a = d.data, from = pal.base.map(hexToRgb), to = pal.variants[variant].map(hexToRgb);
      for (let i = 0; i < a.length; i += 4) {
        if (!a[i + 3]) continue;
        for (let k = 0; k < from.length; k++)
          if (a[i] === from[k][0] && a[i + 1] === from[k][1] && a[i + 2] === from[k][2]) {
            a[i] = to[k][0]; a[i + 1] = to[k][1]; a[i + 2] = to[k][2];
            break;
          }
      }
      x.putImageData(d, 0, 0);
      this._tinted.set(key, c);
      return c;
    }

    static canvas(w, h) {
      if (typeof document !== "undefined") {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        return c;
      }
      return new OffscreenCanvas(w, h);
    }
    static loadImage(url) {
      return new Promise((ok, fail) => {
        const i = new Image();
        i.onload = () => ok(i);
        i.onerror = () => fail(new Error("cannot load " + url));
        i.src = url;
      });
    }
  }

  root.PaperDoll = PaperDoll;
  if (typeof module !== "undefined" && module.exports) module.exports = { PaperDoll };
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

const files = new Map();                       // url → object URL for packs added from disk
const resolve = (u) => files.get(u) || IMAGES[u] || u;
const doll = new PaperDoll(SPEC, { base: "", loadImage: (u) => PaperDoll.loadImage(resolve(u)) });
const $ = (id) => document.getElementById(id), view = $("view"), g = view.getContext("2d");
const BGS = ["#131313", "#000000", "#6f6f6f", "#f2f2f2"];   // preview backgrounds: greys only
const state = { recipe: doll.look(Object.keys(SPEC.looks)[0]) || { parts: {}, colors: {} }, action: "idle", flip: false, t0: performance.now(), sheet: null, bg: 0, tab: "looks" };
const GX = 54, GY = 80;                        // where the feet stand inside the preview canvas (room for capes behind, swings in front, tall hats and jumps above)

async function rebake() {
  state.sheet = await doll.bake(state.recipe);
  $("recipe").value = JSON.stringify(state.recipe);
  renderTabs(); markTiles(); renderColours();
}
function note(text) { $("note").textContent = text; clearTimeout(note.t); note.t = setTimeout(() => ($("note").textContent = ""), 4000); }

// ---- preview
function fit() {                               // integer zoom that fills the stage
  const box = $("viewbox").getBoundingClientRect(), k = Math.max(2, Math.min(8, Math.floor(Math.min((box.width - 24) / view.width, (box.height - 24) / view.height))));
  view.style.width = view.width * k + "px"; view.style.height = view.height * k + "px"; state.zoom = k;
}
function tick(now) {
  g.fillStyle = BGS[state.bg]; g.fillRect(0, 0, view.width, view.height);
  g.fillStyle = state.bg === 3 ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.07)"; g.fillRect(0, GY, view.width, 1);
  if (state.sheet) {
    const f = doll.frameAt(state.action, now - state.t0), a = doll.spec.actions[state.action];
    if (f.done && now - state.t0 > (a.frames + 3) * a.ms) { state.action = "idle"; state.t0 = now; markActions(); }
    g.save();
    if (state.flip) { g.translate(GX * 2, 0); g.scale(-1, 1); }
    g.imageSmoothingEnabled = false;
    g.drawImage(state.sheet, f.x, f.y, f.w, f.h, GX - doll.foot[0], GY - doll.foot[1], f.w, f.h);
    g.restore();
    $("info").textContent = `${state.action}  ${f.index + 1}/${a.frames}  ·  ${f.w}×${f.h}  ·  ${state.zoom}×`;
  }
  requestAnimationFrame(tick);
}

// ---- wardrobe
function renderTabs() {
  const T = $("tabs"); T.innerHTML = "";
  const add = (key, label, has) => {
    const b = document.createElement("button"); b.className = "tab" + (state.tab === key ? " on" : "") + (has ? " has" : "");
    b.innerHTML = `${label}<i class="dot"></i>`; b.onclick = () => { state.tab = key; renderTabs(); renderColours(); renderGrid(); }; T.append(b);
  };
  add("looks", "looks", false);
  for (const slot of doll.slots) add(slot, slot, !!state.recipe.parts[slot] || doll.spec.slots[slot].required);
}
function renderColours() {
  const C = $("colours"); C.innerHTML = "";
  if (state.tab === "looks") { C.innerHTML = '<span class="name">Ready-made characters. Pick one, then change anything.</span>'; return; }
  const slot = state.tab, def = doll.spec.slots[slot], part = def.parts[state.recipe.parts[slot]];
  const follow = part && part.colorFrom, cslot = follow || slot, ramp = doll.spec.slots[cslot].color;
  if (!ramp) { C.innerHTML = '<span class="name">This slot has fixed colours.</span>'; return; }
  const pal = doll.spec.palettes[ramp], cur = state.recipe.colors[cslot] || Object.keys(pal.variants)[0];
  for (const [name, colours] of Object.entries(pal.variants)) {
    const b = document.createElement("button"); b.className = "sw" + (name === cur ? " on" : ""); b.title = name;
    b.style.background = colours[3]; b.onclick = () => { state.recipe.colors[cslot] = name; rebake(); }; C.append(b);
  }

}
const iconCache = new Map();
async function icon(slot, id, canvas) {       // draw the part's 32×32 inventory icon (if the pack ships one)
  const part = doll.spec.slots[slot].parts[id], url = part.base + "icons/" + slot + "/" + id + ".png";
  try {
    if (!iconCache.has(url)) iconCache.set(url, PaperDoll.loadImage(resolve(url)));
    const img = await iconCache.get(url), x = canvas.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(img, 0, 0);
  } catch (e) { /* no icon: leave the tile empty */ }
}
function renderGrid() {
  const G = $("grid"); G.innerHTML = ""; G.className = "grid" + (state.tab === "looks" ? " looks" : "");
  if (state.tab === "looks") {
    for (const name of Object.keys(doll.spec.looks)) {
      const b = document.createElement("button"); b.className = "look"; b.textContent = name.replace(/_/g, " ");
      b.onclick = () => { state.recipe = doll.look(name); rebake(); }; G.append(b);
    }
    return;
  }
  const slot = state.tab, def = doll.spec.slots[slot];
  const tile = (id, label) => {
    const b = document.createElement("button"); b.className = "tile"; b.dataset.id = id; b.title = label;
    if (id) { const c = document.createElement("canvas"); c.width = c.height = 32; b.append(c); icon(slot, id, c); }
    else { const d = document.createElement("div"); d.className = "none"; d.textContent = "∅"; b.append(d); }
    const s = document.createElement("span"); s.textContent = label; b.append(s);
    b.onclick = () => { if (id) state.recipe.parts[slot] = id; else delete state.recipe.parts[slot]; rebake(); };
    G.append(b);
  };
  if (!def.required) tile("", "none");
  for (const id of doll.partIds(slot)) tile(id, id.replace(/_/g, " "));
  markTiles();
}
function markTiles() {
  if (state.tab === "looks") return;
  const def = doll.spec.slots[state.tab], cur = def.required ? Object.keys(def.parts)[0] : state.recipe.parts[state.tab] || "";
  document.querySelectorAll("#grid .tile").forEach((b) => b.classList.toggle("on", b.dataset.id === cur));
}
function markActions() { document.querySelectorAll("#acts .btn[data-a]").forEach((b) => b.classList.toggle("on", b.dataset.a === state.action)); }

// ---- controls
function download(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function framesJson() {
  const out = { image: "character.png", cell: doll.cell, foot: doll.foot, faces: "right", recipe: state.recipe, actions: {} };
  for (const [name, a] of Object.entries(doll.spec.actions))
    out.actions[name] = { ms: a.ms, loop: a.loop, frames: Array.from({ length: a.frames }, (_, i) => { const f = doll.frame(name, i); return { x: f.x, y: f.y, w: f.w, h: f.h }; }) };
  return out;
}
for (const a of Object.keys(SPEC.actions)) {
  const b = document.createElement("button"); b.className = "btn sm"; b.textContent = a; b.dataset.a = a;
  b.onclick = () => { state.action = a; state.t0 = performance.now(); markActions(); }; $("acts").append(b);
}
{ const b = document.createElement("button"); b.className = "btn sm"; b.textContent = "⇄ face left"; b.style.marginLeft = "auto";
  b.onclick = () => { state.flip = !state.flip; b.classList.toggle("on", state.flip); }; $("acts").append(b); }
BGS.forEach((c, i) => { const b = document.createElement("button"); b.className = "sw" + (i === 0 ? " on" : ""); b.style.background = c;
  b.onclick = () => { state.bg = i; document.querySelectorAll("#bgs .sw").forEach((x, j) => x.classList.toggle("on", j === i)); }; $("bgs").append(b); });
$("random").onclick = () => { state.recipe = doll.random(); rebake(); };
$("randcol").onclick = () => { for (const s of doll.slots) { const n = doll.colorNames(s); if (n.length) state.recipe.colors[s] = n[Math.floor(Math.random() * n.length)]; } rebake(); };
$("clear").onclick = () => { state.recipe = { parts: {}, colors: {} }; rebake(); };
$("png").onclick = () => state.sheet.toBlob((b) => { download("character.png", b); note("Saved character.png"); });
$("json").onclick = () => { download("character.json", new Blob([JSON.stringify(framesJson(), null, 1)], { type: "application/json" })); note("Saved character.json"); };
$("copy").onclick = () => { $("recipe").select(); if (navigator.clipboard) navigator.clipboard.writeText($("recipe").value); note("Recipe copied"); };
$("load").onclick = () => { try { const r = JSON.parse($("recipe").value); state.recipe = { parts: r.parts || {}, colors: r.colors || {} }; rebake(); note("Recipe loaded"); } catch (e) { note("Not a valid recipe: " + e.message); } };
$("pack").onclick = () => $("dir").click();
$("dir").onchange = async (e) => {

  const all = [...e.target.files], meta = all.find((f) => f.name === "pack.json");
  if (!meta) { note("No pack.json in that folder."); return; }
  const pack = JSON.parse(await meta.text()), root = meta.webkitRelativePath.slice(0, -"pack.json".length), base = "pack:" + pack.pack + "/";
  for (const f of all) if (f.name.endsWith(".png")) files.set(base + f.webkitRelativePath.slice(root.length), URL.createObjectURL(f));

  note("Added " + pack.name); e.target.value = "";
};
addEventListener("resize", fit);
const wanted = new URLSearchParams(location.search).get("tab");   // ?tab=hair opens that slot
if (wanted && (wanted === "looks" || doll.spec.slots[wanted])) state.tab = wanted;
window.__maker = { doll, state, rebake };
