name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build game
        run: npm run build

      # build.mjs 會輸出單一 HTML（檔名為中文）。複製成 index.html 當 Pages 首頁。
      # pwa/ 是 manifest、service worker 與 App 圖示，放到 Pages 根目錄讓遊戲能「加到主畫面」。
      - name: Prepare site
        run: |
          mkdir -p site
          cp dist/*.html site/index.html
          cp -r pwa/. site/
          cp -r ota/. site/
          echo "Site contents:" && ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
