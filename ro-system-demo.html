<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RO 式裝備動畫系統 · 移植 demo</title>
<style>
  :root{--bg:#0a0c10;--panel:#12161d;--panel2:#171c25;--line:#232a36;--text:#e8edf5;
        --dim:#8a97a8;--ro:#ff8a3d;--cy:#4cc9f0;--ok:#3ddc97;--bad:#ff6b6b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{background:
      radial-gradient(900px 520px at 15% -10%,rgba(255,138,61,.10),transparent 60%),
      radial-gradient(700px 400px at 90% 5%,rgba(76,201,240,.07),transparent 60%),var(--bg);
    color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    line-height:1.6;padding:0 14px 70px;max-width:900px;margin:0 auto}
  h1{font-size:clamp(21px,6vw,30px);margin:22px 0 4px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px;margin:0 0 12px}
  .tabs{display:flex;gap:8px;margin:10px 0 0}
  .tab{flex:1;text-align:center;padding:9px;border-radius:11px;border:1px solid var(--line);
    background:#0d1117;color:var(--dim);font-size:13.5px;cursor:pointer}
  .tab.on{border-color:var(--ro);color:var(--ro);background:rgba(255,138,61,.10)}

  .stage{position:relative;margin:12px 0;border-radius:16px;border:1px solid var(--line);
    background:
      radial-gradient(circle at 50% 88%, rgba(255,138,61,.10), transparent 60%),
      linear-gradient(45deg,#0e1218 25%,transparent 25%,transparent 75%,#0e1218 75%),
      linear-gradient(45deg,#0e1218 25%,#0b0f15 25%,#0b0f15 75%,#0e1218 75%);
    background-size:auto,18px 18px,18px 18px;background-position:0 0,0 0,9px 9px;
    overflow:hidden;height:340px;display:flex;align-items:flex-end;justify-content:center}
  .ground{position:absolute;left:0;right:0;bottom:46px;height:1px;background:rgba(255,255,255,.10)}
  #char{image-rendering:pixelated;height:300px;width:auto;position:relative;bottom:0;
    transition:transform .12s linear;pointer-events:none}
  #hat{position:absolute;left:50%;top:27%;image-rendering:pixelated;cursor:grab;touch-action:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));z-index:3}
  .hud{position:absolute;left:10px;top:8px;font-size:11px;color:var(--dim);
    background:rgba(0,0,0,.45);padding:3px 8px;border-radius:7px;font-family:ui-monospace,monospace}

  .bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
  .btn{background:#0d1117;border:1px solid var(--line);color:var(--text);border-radius:11px;
    padding:10px 4px;font-size:12.5px;cursor:pointer;text-align:center}
  .btn.on{border-color:var(--ro);background:rgba(255,138,61,.12);color:var(--ro)}
  .btn.dead{border-color:rgba(255,107,107,.5);color:var(--bad)}

  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  .row .btn{flex:1}
  input[type=range]{width:100%;accent-color:var(--ro)}
  .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

  .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:16px;padding:14px;margin:14px 0}
  .panel h2{font-size:16px;margin:0 0 8px}
  .hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px}
  .hatcell{background:#0d1117;border:1px solid var(--line);border-radius:11px;padding:5px;cursor:pointer;text-align:center}
  .hatcell img{width:100%;height:38px;object-fit:contain;display:block}
  .hatcell.on{border-color:var(--ro);background:rgba(255,138,61,.10)}
  .tog{display:flex;align-items:center;gap:8px;background:#0d1117;border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:12.5px;margin:6px 0}
  .tog input{appearance:none;width:30px;height:18px;border-radius:999px;background:#2a3444;
    position:relative;outline:none;transition:.2s;flex:0 0 auto}
  .tog input:checked{background:var(--cy)}
  .tog input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;transition:.2s}
  .tog input:checked::after{transform:translateX(12px)}
  .layerstage{position:relative;height:300px;border:1px dashed var(--line);border-radius:12px;
    background:#0b0f15;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .layerstage img{position:absolute;bottom:0;height:290px;image-rendering:pixelated}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:12.5px}
  .kv div:nth-child(odd){color:var(--dim)}
  .kv div:nth-child(even){font-family:ui-monospace,monospace;font-size:11.5px;color:#a9e6ff;word-break:break-all}
  .note{font-size:12.5px;color:var(--dim);border-left:2px solid var(--ro);padding-left:10px;margin:10px 0}
  footer{text-align:center;color:#5b6675;font-size:11.5px;margin-top:18px}
  @media(max-width:420px){.bar{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<h1>RO 式裝備動畫系統</h1>
<p class="sub">把 RO 的「圖層 + 動作 + 錨點」移植進 mistvale 的角色。你可以直接操控動作。</p>

<div class="tabs">
  <div class="tab on" data-tab="play">動作播放</div>
  <div class="tab" data-tab="layers">圖層拆解</div>
</div>

<!-- ============ tab: play ============ -->
<div id="tab-play">
  <div class="stage" id="stage">
    <div class="hud" id="hud">idle · 1/8</div>
    <div class="ground"></div>
    <img id="char" alt="">
    <img id="hat" alt="">
  </div>

  <div class="bar" id="actionBar"></div>

  <div class="row">
    <button class="btn" id="flip">↔ 方向</button>
    <button class="btn" id="pause">⏸ 暫停</button>
    <button class="btn" id="revive">復活</button>
  </div>

  <div class="lbl"><span>帧</span><span id="frameNo">1</span></div>
  <input type="range" id="scrub" min="0" max="7" value="0">

  <div class="panel">
    <h2>裝備（RO 外觀）</h2>
    <div class="hats" id="hats"></div>
    <div class="lbl" style="margin-top:10px"><span>帽子 X</span><span id="vx">0</span></div>
    <input type="range" id="sx" min="-70" max="70" value="0">
    <div class="lbl"><span>帽子 Y</span><span id="vy">0</span></div>
    <input type="range" id="sy" min="-90" max="90" value="0">
    <div class="lbl"><span>縮放</span><span id="vs">0.34</span></div>
    <input type="range" id="ss" min="15" max="120" value="34">
    <div class="kv" id="hatInfo" style="margin-top:10px"></div>
  </div>
</div>

<!-- ============ tab: layers ============ -->
<div id="tab-layers" style="display:none">
  <div class="panel">
    <h2>圖層拆解</h2>
    <p class="sub" style="margin:0 0 8px">同一張關鍵姿勢拆成 body / crest / weapon——這就是 RO 的圖層概念。</p>
    <div class="layerstage" id="layerStage"></div>
    <div id="layerToggles"></div>
    <p class="note">RO 把這些層寫成獨立的 <code>.spr</code>；這裡是同一張畫布拆出來的檔案，座標天然對齊。</p>
  </div>
</div>

<footer>角色與動作：mistvale sprites/characters · 頭飾：RO ophkg_headcraft.grf</footer>

":true,"sprPath":"data/sprite/악세사리/남/남_빛나는해바라기.spr","actPath":"data/sprite/악세사리/남/남_빛나는해바라기.act"}],"actions":{"idle":{"ms":160,"loop":true},"walk":{"ms":100,"loop":true},"attack":{"ms":75,"loop":false,"next":"idle"},"hurt":{"ms":100,"loop":false,"next":"idle"},"death":{"ms":120,"loop":false,"next":null}}};
const $ = (id) => document.getElementById(id);

/* ---------- state ---------- */
let hero = DATA.heroes[0];
let action = "idle";
let frame = 0;
let dir = 1;
let playing = true;
let timer = null;
let hat = DATA.hats[0];
let ox = 0, oy = 0, sc = 0.34;

/* ---------- action bar ---------- */
const LABEL = { idle: "待機", walk: "走路", attack: "攻擊", hurt: "受傷", death: "死亡" };
const ORDER = ["idle", "walk", "attack", "hurt", "death"];

function buildBar() {
  $("actionBar").innerHTML = "";
  ORDER.forEach(a => {
    if (!hero.actions[a]) return;
    const b = document.createElement("button");
    b.className = "btn" + (a === action ? " on" : "") + (a === "death" ? " dead" : "");
    b.textContent = LABEL[a];
    b.dataset.act = a;
    b.onclick = () => setAction(a);
    $("actionBar").appendChild(b);
  });
}

/* ---------- playback ---------- */
function setAction(a) {
  action = a;
  frame = 0;
  playing = true;
  document.querySelectorAll("#actionBar .btn").forEach(b =>
    b.classList.toggle("on", b.dataset.act === a));
  $("scrub").max = (hero.actions[a]?.length || 1) - 1;
  $("scrub").value = 0;
  render();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  const meta = DATA.actions[action];
  timer = setTimeout(() => {
    const total = hero.actions[action].length;
    if (frame + 1 >= total) {
      if (meta.loop) frame = 0;
      else if (meta.next) { setAction(meta.next); return; }
      else { playing = false; return; }
    } else frame++;
    render();
    schedule();
  }, meta.ms);
}

function render() {
  const frames = hero.actions[action];
  $("char").src = "data:image/png;base64," + frames[Math.min(frame, frames.length - 1)];
  $("hud").textContent = `${action} · ${frame + 1}/${frames.length}`;
  $("frameNo").textContent = frame + 1;
  $("scrub").value = frame;
  $("char").style.transform =
    (dir < 0 ? "scaleX(-1) " : "") +
    (action === "walk" ? `translateX(${Math.sin(frame / 8 * Math.PI * 2) * 18}px)` : "translateX(0)");
}

$("scrub").oninput = (e) => {
  playing = false;
  frame = Number(e.target.value);
  render();
};
$("pause").onclick = () => {
  playing = !playing;
  $("pause").textContent = playing ? "⏸ 暫停" : "▶ 繼續";
  if (playing) schedule(); else clearTimeout(timer);
};
$("flip").onclick = () => { dir *= -1; render(); };
$("revive").onclick = () => { setAction("idle"); };

/* ---------- hats ---------- */
function buildHats() {
  $("hats").innerHTML = "";
  DATA.hats.forEach((h, i) => {
    const d = document.createElement("div");
    d.className = "hatcell" + (i === 0 ? " on" : "");
    d.innerHTML = `<img src="data:image/png;base64,${h.icon}" alt="">`;
    d.onclick = () => {
      document.querySelectorAll(".hatcell").forEach(x => x.classList.remove("on"));
      d.classList.add("on");
      hat = h;
      applyHat();
      renderHatInfo();
    };
    $("hats").appendChild(d);
  });
}

function applyHat() {
  const img = $("hat");
  img.src = "data:image/png;base64," + hat.icon;
  img.style.width = Math.round(300 * sc) + "px";
  img.style.left = `calc(50% + ${ox}px)`;
  img.style.top = `calc(27% + ${oy}px)`;
  img.style.transform = "translate(-50%,-50%)" + (dir < 0 ? " scaleX(-1)" : "");
  $("vx").textContent = ox;
  $("vy").textContent = oy;
  $("vs").textContent = sc.toFixed(2);
}

function renderHatInfo() {
  $("hatInfo").innerHTML = `
    <div>view</div><div>${hat.view}</div>
    <div>AccName</div><div>${hat.accname}</div>
    <div>資源名</div><div>${hat.resource}</div>
    <div>穿戴圖</div><div>${hat.sprPath || "—"}</div>`;
}

$("sx").oninput = e => { ox = +e.target.value; applyHat(); };
$("sy").oninput = e => { oy = +e.target.value; applyHat(); };
$("ss").oninput = e => { sc = +e.target.value / 100; applyHat(); };

/* drag hat */
(function () {
  const img = $("hat");
  let on = false, x0 = 0, y0 = 0, ox0 = 0, oy0 = 0;
  const down = e => { on = true; const p = e.touches ? e.touches[0] : e;
    x0 = p.clientX; y0 = p.clientY; ox0 = ox; oy0 = oy; };
  const move = e => {
    if (!on) return;
    const p = e.touches ? e.touches[0] : e;
    ox = Math.max(-70, Math.min(70, Math.round(ox0 + p.clientX - x0)));
    oy = Math.max(-90, Math.min(90, Math.round(oy0 + p.clientY - y0)));
    $("sx").value = ox; $("sy").value = oy;
    applyHat();
    if (e.cancelable) e.preventDefault();
  };
  const up = () => on = false;
  img.addEventListener("mousedown", down);
  img.addEventListener("touchstart", down, { passive: true });
  window.addEventListener("mousemove", move);
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("mouseup", up);
  window.addEventListener("touchend", up);
})();

/* ---------- layer tab ---------- */
function buildLayers() {
  const st = $("layerStage");
  const tg = $("layerToggles");
  st.innerHTML = ""; tg.innerHTML = "";
  hero.layers.forEach(l => {
    const img = document.createElement("img");
    img.src = "data:image/png;base64," + l.png;
    img.dataset.kind = l.kind;
    st.appendChild(img);

    const lab = document.createElement("label");
    lab.className = "tog";
    lab.innerHTML = `<input type="checkbox" checked><span>${l.kind}（layer${String(l.slot).padStart(2,"0")}）</span>`;
    lab.querySelector("input").onchange = e => { img.style.display = e.target.checked ? "" : "none"; };
    tg.appendChild(lab);
  });
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    const which = t.dataset.tab;
    $("tab-play").style.display = which === "play" ? "" : "none";
    $("tab-layers").style.display = which === "layers" ? "" : "none";
  };
});

/* ---------- keyboard ---------- */
window.addEventListener("keydown", (e) => {
  const map = { "1": "idle", "2": "walk", "3": "attack", "4": "hurt", "5": "death" };
  if (map[e.key]) setAction(map[e.key]);
  if (e.key === "ArrowLeft") { dir = -1; render(); }
  if (e.key === "ArrowRight") { dir = 1; render(); }
  if (e.key === " ") { e.preventDefault(); $("pause").click(); }
});

/* ---------- boot ---------- */
buildBar();
buildHats();
applyHat();
renderHatInfo();
setAction("idle");
buildLayers();
</script>
</body>
</html>
