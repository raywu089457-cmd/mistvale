<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#223}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script type="module">
import{createWorld}from'./src/pixel-world.js';import{BUILDINGS}from'./src/pixel-data.js';
const world=createWorld(document.getElementById('c'),{onSelect:console.log});const state={buildings:Object.fromEntries(BUILDINGS.map(b=>[b.id,1])),hunters:['berserker','ranger','paladin','sorcerer','darkknight'].map((classId,i)=>({id:'h'+i,classId,name:'獵人'+i,x:i*2-5,z:4,hp:80,maxHp:100,level:1,status:'出征中'})),enemies:[{id:'a',type:'slime',x:15,z:1,hp:50,maxHp:50},{id:'b',type:'wolf',x:19,z:4,hp:50,maxHp:50},{id:'c',type:'golem',x:25,z:1,hp:50,maxHp:50},{id:'d',type:'boss',x:24,z:-6,hp:50,maxHp:50}],effects:[]};let last=performance.now();function tick(t){world.update((t-last)/1000,state);last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);window.addEventListener('resize',world.resize);window.world=world;
</script></body></html>
